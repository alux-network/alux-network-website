<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" role="img" aria-labelledby="title desc">
  <title id="title">基于身份的环境权限</title>
  <desc id="desc">人物的工牌代表身份环境权限；执行可据此访问 B、A、C 和财务四个既有对象。</desc>
  <defs>
    <filter id="figure-shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="7" stdDeviation="6" flood-color="#70583a" flood-opacity="0.13"/>
    </filter>
    <filter id="object-shadow" x="-40%" y="-40%" width="180%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#70583a" flood-opacity="0.11"/>
    </filter>
  </defs>

  <rect x="10" y="10" width="580" height="340" rx="44" fill="#fffaf3" stroke="#dfe3e4" stroke-width="2"/>
  <!-- Authority carried by the identity reaches every object directly. -->
  <g fill="none" stroke="#a67951" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.82">
    <path d="M286 180 H370 V119 H427"/>
    <path d="M370 180 V234 H398"/>
  </g>

  <!-- Young technical-founder CEO minifigure in the Team-page visual language. -->
  <g transform="translate(-20 -5) scale(1.6)" filter="url(#figure-shadow)">
    <rect x="58" y="190" width="104" height="14" rx="4" fill="#9a6c45" opacity="0.92"/>
    <g fill="#9a6c45" opacity="0.92">
      <rect x="64" y="185.5" width="9" height="5" rx="1.5"/>
      <rect x="78" y="185.5" width="9" height="5" rx="1.5"/>
      <rect x="92" y="185.5" width="9" height="5" rx="1.5"/>
      <rect x="106" y="185.5" width="9" height="5" rx="1.5"/>
      <rect x="120" y="185.5" width="9" height="5" rx="1.5"/>
      <rect x="134" y="185.5" width="9" height="5" rx="1.5"/>
      <rect x="148" y="185.5" width="9" height="5" rx="1.5"/>
    </g>
    <rect x="85" y="142" width="50" height="11" rx="2" fill="#1d2938"/>
    <rect x="87" y="153" width="22" height="37" rx="2" fill="#30435b"/>
    <rect x="111" y="153" width="22" height="37" rx="2" fill="#30435b"/>
    <rect x="84" y="181" width="29" height="10" rx="3" fill="#151d28"/>
    <rect x="107" y="181" width="29" height="10" rx="3" fill="#151d28"/>
    <path d="M80 96 L140 96 L146 143 L74 143 Z" fill="#1d2938"/>
    <path d="M82 96 L99 96 L110 108 L98 121 L86 104 Z" fill="#2b3c51"/>
    <path d="M138 96 L121 96 L110 108 L122 121 L134 104 Z" fill="#2b3c51"/>
    <path d="M100 96 H120 L116 119 H104 Z" fill="#fffaf3"/>
    <path d="M100 96 L110 106 L104 113 Z" fill="#e7edf0"/>
    <path d="M120 96 L110 106 L116 113 Z" fill="#e7edf0"/>
    <path d="M106.5 104 L110 101.5 L113.5 104 L110 108 Z" fill="#7e7894"/>
    <path d="M110 108 L114 120 L110 124 L106 120 Z" fill="#7e7894"/>
    <circle cx="111" cy="130" r="2.1" fill="#b89363"/>
    <path d="M84 98 C75 103 73 113 75 124 L87 128 C85 118 86 107 91 102 Z" fill="#1d2938"/>
    <path d="M136 98 C145 103 147 113 145 124 L133 128 C135 118 134 107 129 102 Z" fill="#1d2938"/>
    <g>
      <path d="M101 124 V120 C101 116 104 113 108 113 H112 C116 113 119 116 119 120 V124" fill="none" stroke="#60748a" stroke-width="3.2" stroke-linecap="round"/>
      <rect x="91" y="123" width="38" height="28" rx="5" fill="#a9b7c7" stroke="#60748a" stroke-width="2.4"/>
      <path d="M92.5 132 H127.5" fill="none" stroke="#7f93a9" stroke-width="1.7"/>
      <rect x="107" y="129" width="6" height="6" rx="1.5" fill="#d2ad76"/>
    </g>
    <rect x="101" y="88" width="18" height="8" fill="#f1c9a4"/>
    <circle cx="87" cy="130" r="7.5" fill="#f1c9a4"/>
    <circle cx="133" cy="130" r="7.5" fill="#f1c9a4"/>
    <rect x="87" y="48" width="46" height="40" rx="10" fill="#f1c9a4"/>
    <circle cx="101" cy="65" r="2.7" fill="#26364a"/>
    <circle cx="119" cy="65" r="2.7" fill="#26364a"/>
    <path d="M101 75 C105 80 115 80 119 75" fill="none" stroke="#26364a" stroke-width="2.35" stroke-linecap="round"/>
    <path d="M87 59 C87 45 97 37 110 37 C123 37 133 45 133 59 Q110 51.5 87 59 Z" fill="#18212b"/>
  </g>

  <!-- Employee badge: warm leather color separates it from the navy suit and paper background. -->
  <g filter="url(#object-shadow)">
    <rect x="228" y="144" width="58" height="72" rx="12" fill="#d8b182" stroke="#8a6345" stroke-width="4"/>
    <rect x="245" y="135" width="24" height="14" rx="7" fill="#8a6345"/>
    <circle cx="257" cy="168" r="10" fill="#fff5e8"/>
    <path d="M239 202 C242 186 272 186 275 202 Z" fill="#fff5e8"/>
  </g>

  <!-- Bob is the target; Alice, Carol, and finance are unrelated but still reachable through ambient identity authority. -->
  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" text-anchor="middle" dominant-baseline="middle" filter="url(#object-shadow)">
    <g>
      <rect x="427" y="88" width="68" height="62" rx="14" fill="#dfeee8" stroke="#6ca07d" stroke-width="3"/>
      <rect x="439" y="82" width="16" height="8" rx="2.5" fill="#6ca07d"/>
      <rect x="467" y="82" width="16" height="8" rx="2.5" fill="#6ca07d"/>
      <text x="461" y="120" fill="#285e55" font-size="25">B</text>
    </g>
    <g>
      <rect x="398" y="212" width="42" height="44" rx="10" fill="#eee8f0" stroke="#a88eac" stroke-width="3"/>
      <rect x="406" y="207" width="10" height="7" rx="2" fill="#a88eac"/>
      <rect x="422" y="207" width="10" height="7" rx="2" fill="#a88eac"/>
      <text x="419" y="235" fill="#62556a" font-size="18">A</text>
    </g>
    <g>
      <rect x="443" y="212" width="42" height="44" rx="10" fill="#e8e9f1" stroke="#8d91b8" stroke-width="3"/>
      <rect x="451" y="207" width="10" height="7" rx="2" fill="#8d91b8"/>
      <rect x="467" y="207" width="10" height="7" rx="2" fill="#8d91b8"/>
      <text x="464" y="235" fill="#515779" font-size="18">C</text>
    </g>
    <g>
      <rect x="488" y="212" width="42" height="44" rx="10" fill="#f0eadc" stroke="#bea16a" stroke-width="3"/>
      <rect x="496" y="207" width="10" height="7" rx="2" fill="#bea16a"/>
      <rect x="512" y="207" width="10" height="7" rx="2" fill="#bea16a"/>
      <text x="509" y="235" fill="#745f35" font-size="18">$</text>
    </g>
  </g>
</svg>
