<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=768, initial-scale=1">
  <title>ALUX Network — GLVM 官网二维码海报</title>
  <style>
    :root {
      --paper: #faf7ef;
      --paper-deep: #f0e8dc;
      --ink: #1d3448;
      --copy: #5a6f80;
      --brown: #5d402d;
      --brown-soft: #8d6a50;
      --line: rgba(111, 83, 60, 0.16);
      --mint: #8bcfbd;
      --gold: #bb7b3d;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 768px;
      height: 1024px;
      margin: 0;
      overflow: hidden;
    }

    body {
      font-family: "Noto Sans SC", "Microsoft YaHei", "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 89% 10%, rgba(246, 199, 123, 0.15), transparent 29%),
        radial-gradient(circle at 13% 87%, rgba(139, 207, 189, 0.09), transparent 30%),
        linear-gradient(145deg, #fcfaf5 0%, var(--paper) 58%, #f3ede3 100%);
    }

    .canvas {
      position: relative;
      width: 100%;
      height: 100%;
      isolation: isolate;
      overflow: hidden;
    }

    .canvas::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -4;
      background-image:
        linear-gradient(rgba(86, 64, 46, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(86, 64, 46, 0.04) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: linear-gradient(90deg, #000 0%, rgba(0, 0, 0, 0.82) 70%, rgba(0, 0, 0, 0.35) 100%);
    }

    .frame {
      position: absolute;
      inset: 20px;
      border: 1px solid var(--line);
      border-radius: 34px;
      background: rgba(255, 253, 248, 0.48);
      box-shadow:
        0 28px 70px rgba(72, 49, 33, 0.09),
        inset 0 1px rgba(255, 255, 255, 0.94);
      overflow: hidden;
    }

    .brand {
      position: absolute;
      left: 59px;
      top: 52px;
      display: flex;
      align-items: center;
      gap: 16px;
      z-index: 8;
    }

    .brand img {
      width: 56px;
      height: 56px;
      border-radius: 15px;
      box-shadow: 0 11px 20px rgba(67, 42, 27, 0.20);
    }

    .brand-name {
      color: var(--ink);
      font-size: 26px;
      line-height: 1;
      font-weight: 850;
      letter-spacing: -0.045em;
    }

    .brand-note {
      margin-top: 9px;
      color: var(--copy);
      font-family: "Cascadia Mono", "Consolas", monospace;
      font-size: 10px;
      line-height: 1;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .official {
      position: absolute;
      right: 43px;
      top: 49px;
      display: inline-flex;
      align-items: center;
      gap: 9px;
      min-height: 38px;
      padding: 0 17px;
      border: 1px solid rgba(145, 105, 75, 0.22);
      border-radius: 999px;
      color: var(--brown);
      background: rgba(255, 252, 246, 0.82);
      font-size: 14px;
      font-weight: 750;
      box-shadow: 0 8px 20px rgba(93, 64, 45, 0.05);
      z-index: 8;
    }

    .official::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--mint);
      box-shadow: 0 0 0 6px rgba(139, 207, 189, 0.16);
    }

    .hero {
      position: absolute;
      left: 58px;
      right: 43px;
      top: 156px;
      z-index: 6;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      min-height: 32px;
      padding: 0 15px;
      border: 1px solid rgba(152, 105, 70, 0.22);
      border-radius: 999px;
      color: var(--brown-soft);
      background: rgba(255, 252, 246, 0.78);
      font-family: "Cascadia Mono", "Consolas", monospace;
      font-size: 10px;
      line-height: 1;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    h1 {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin: 20px 0 0;
      color: var(--ink);
      font-size: 55px;
      line-height: 1.01;
      letter-spacing: -0.065em;
      font-weight: 900;
    }

    h1 span {
      display: block;
      white-space: nowrap;
    }

    .hero-copy {
      margin: 20px 0 0;
      color: var(--copy);
      font-size: 17px;
      line-height: 1.55;
      letter-spacing: -0.025em;
      font-weight: 500;
      white-space: nowrap;
    }

    .stage {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
    }

    .stage img {
      position: absolute;
      display: block;
      object-fit: contain;
      filter: drop-shadow(0 18px 22px rgba(93, 67, 46, 0.10));
    }

    .sun {
      width: 86px;
      height: 86px;
      right: 6px;
      top: 244px;
      opacity: 0.82;
    }

    .upper {
      width: 275px;
      height: auto;
      right: -72px;
      top: 378px;
      transform: rotate(2deg);
      opacity: 0.58;
    }

    .lower {
      width: 390px;
      height: auto;
      right: -84px;
      bottom: 56px;
      opacity: 0.92;
    }

    .qr-card {
      position: absolute;
      left: 132px;
      top: 392px;
      width: 464px;
      height: 512px;
      border: 1px solid rgba(111, 83, 60, 0.18);
      border-radius: 31px;
      background: rgba(255, 253, 249, 0.94);
      box-shadow:
        0 24px 58px rgba(75, 51, 34, 0.12),
        inset 0 1px rgba(255, 255, 255, 0.96);
      z-index: 9;
    }

    .qr-card::after {
      content: "";
      position: absolute;
      inset: 10px;
      border: 1px solid rgba(122, 93, 71, 0.07);
      border-radius: 23px;
      pointer-events: none;
    }

    .qr-heading {
      position: absolute;
      left: 31px;
      top: 26px;
      color: var(--ink);
      font-size: 24px;
      line-height: 1;
      font-weight: 850;
      letter-spacing: -0.045em;
      z-index: 3;
    }

    .qr-english {
      position: absolute;
      right: 31px;
      top: 32px;
      color: var(--brown-soft);
      font-family: "Cascadia Mono", "Consolas", monospace;
      font-size: 10px;
      line-height: 1;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      z-index: 3;
    }

    .qr-wrap {
      position: absolute;
      left: 50px;
      top: 70px;
      width: 364px;
      height: 364px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(29, 52, 72, 0.10);
      border-radius: 24px;
      background: #fff;
      z-index: 2;
    }

    .qr-wrap img {
      width: 338px;
      height: 338px;
      display: block;
      image-rendering: crisp-edges;
    }

    .corner {
      position: absolute;
      width: 34px;
      height: 34px;
      color: var(--ink);
      opacity: 0.9;
    }

    .corner.tl {
      left: -5px;
      top: -5px;
      border-left: 3px solid;
      border-top: 3px solid;
      border-radius: 12px 0 0 0;
    }

    .corner.tr {
      right: -5px;
      top: -5px;
      border-right: 3px solid;
      border-top: 3px solid;
      border-radius: 0 12px 0 0;
    }

    .corner.bl {
      left: -5px;
      bottom: -5px;
      border-left: 3px solid;
      border-bottom: 3px solid;
      border-radius: 0 0 0 12px;
    }

    .corner.br {
      right: -5px;
      bottom: -5px;
      border-right: 3px solid;
      border-bottom: 3px solid;
      border-radius: 0 0 12px 0;
    }

    .qr-action {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 23px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      z-index: 3;
    }

    .scan-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 134px;
      height: 42px;
      padding: 0 18px;
      border-radius: 999px;
      color: #fffaf3;
      background: linear-gradient(180deg, #c48749 0%, #b56f31 100%);
      box-shadow: 0 10px 22px rgba(151, 91, 43, 0.18);
      font-size: 15px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .site {
      color: var(--copy);
      font-size: 13px;
      font-weight: 750;
      letter-spacing: -0.01em;
    }

    .footer {
      position: absolute;
      left: 58px;
      bottom: 29px;
      z-index: 10;
    }

    .footer-title {
      color: var(--ink);
      font-size: 14px;
      line-height: 1;
      font-weight: 800;
      letter-spacing: 0.02em;
    }

    .footer-site {
      margin-top: 12px;
      color: var(--copy);
      font-size: 10px;
      line-height: 1;
      font-weight: 750;
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>
  <main class="canvas" aria-label="ALUX Network GLVM 官网二维码海报">
    <section class="frame">
      <header class="brand">
        <img src="../../../alux-favicon.png" alt="ALUX Network 标志">
        <div>
          <div class="brand-name">ALUX Network</div>
          <div class="brand-note">Composable Runtime</div>
        </div>
      </header>

      <div class="official">官方网站</div>

      <section class="hero">
        <div class="eyebrow">ALUX Network · Official</div>
        <h1>
          <span>构建 GLVM：让多台 TVM</span>
          <span>协同为一个逻辑执行层</span>
        </h1>
        <p class="hero-copy">扫码访问 ALUX Network 官网，了解 GLVM 架构、当前运行时与演进路线。</p>
      </section>

      <div class="stage" aria-hidden="true">
        <img class="sun" src="../../../home/hero/alux-hero-3d-sun.png" alt="">
        <img class="upper" src="../../../home/hero/alux-hero-3d-upper-brick.png" alt="">
        <img class="lower" src="../../../home/hero/alux-hero-3d-lower-assembly.png" alt="">
      </div>

      <section class="qr-card">
        <div class="qr-heading">扫描二维码</div>
        <div class="qr-english">Scan to enter</div>

        <div class="qr-wrap">
          <span class="corner tl"></span>
          <span class="corner tr"></span>
          <span class="corner bl"></span>
          <span class="corner br"></span>
          <img src="alux-network-website-qr.png" alt="扫描访问 ALUX Network 官方网站">
        </div>

        <div class="qr-action">
          <div class="scan-button">扫码进入官网</div>
          <div class="site">alux.network</div>
        </div>
      </section>

      <footer class="footer">
        <div class="footer-title">构建 · 协同 · 组合</div>
        <div class="footer-site">alux.network ↗</div>
      </footer>
    </section>
  </main>
</body>
</html>
